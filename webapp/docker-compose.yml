services:
  migrate:
    build:
      context: .
      target: build
    command: npx drizzle-kit push --force
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - observatoire

  webapp:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://observatoire.vuedensemble.fr
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - observatoire

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp
    restart: unless-stopped
    networks:
      - observatoire

volumes:
  caddy_data:
  caddy_config:

networks:
  observatoire:
    name: observatoire
    external: true
